[package]
name = "checksen"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures = "0.3.34"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
hmac = "0.12"
khqr-core = "0.4"
moka = { version = "0.12", features = ["sync"] }
psl = "2.1.238"
regex = "1.13.1"
reqwest = "0.12"
rxing = { version = "0.9.3", default-features = false, features = ["image", "decoders", "multi_barcode_readers", "qrcode", "encoding_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono"] }
strsim = "0.11.1"
teloxide = "0.17.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2"

[dev-dependencies]
khqr-core = { version = "0.4", features = ["image"] }
