[package]
name = "checksen"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures = "0.3.34"
khqr-core = "0.4"
psl = "2.1.238"
regex = "1.13.1"
reqwest = "0.12"
rxing = "0.9.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strsim = "0.11.1"
teloxide = "0.17.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2"

[dev-dependencies]
image = "0.25"
khqr-core = { version = "0.4", features = ["image"] }
